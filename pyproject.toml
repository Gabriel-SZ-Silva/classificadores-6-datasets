[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classificadores-6-datasets"
version = "1.0.0"
description = "SVM, Decision Tree, Random Forest e Gradient Boosting avaliados em 6 datasets, com diagnóstico de viés e variância"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Souza Silva" }]
dependencies = [
    "scikit-learn>=1.4,<2",
    "pandas>=2.0,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
kaggle = ["kagglehub>=0.3"]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.45"]

[project.scripts]
classificadores = "classificadores.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
